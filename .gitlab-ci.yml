stages:
  - test
  - build

variables:
  POSTGRES_DB: albion_profit
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: "123"
  POSTGRES_HOST_AUTH_METHOD: trust

test:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16-alpine
  variables:
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: albion_profit
    DB_USER: postgres
    DB_PASSWORD: "123"
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest test_main.py -v --cov=main

docker-build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t albion-profit-calculator:latest .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
