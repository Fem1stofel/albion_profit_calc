services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: albion_profit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d albion_profit"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=albion_profit
      - DB_USER=postgres
      - DB_PASSWORD=123
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: